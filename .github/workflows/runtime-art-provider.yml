name: Mega runtime art provider checks
on:
  push:
    branches: [feature/mega-runtime-art-provider]
  pull_request:
    paths:
      - 'src/mega_atlas.lua'
      - 'src/mega_selection.lua'
      - 'src/mega_trainer_policy.lua'
      - 'data/mega_trainer_choices.lua'
      - 'tests/test_mega_trainer_policy.lua'
      - 'docs/MEGA_TRAINER_REVIEW.md'
      - 'src/mega_venusaur.lua'
      - 'src/mega_standalone.lua'
      - 'src/mega_abilities.lua'
      - 'src/mega_reactive_abilities.lua'
      - 'src/mega_tactical_abilities.lua'
      - 'src/mega_weather_abilities.lua'
      - 'src/mega_specialized_abilities.lua'
      - 'src/mega_precision_abilities.lua'
      - 'src/mega_champions_abilities.lua'
      - 'src/mega_field_abilities.lua'
      - 'src/mega_ability_interactions.lua'
      - 'src/mega_ability_edge_cases.lua'
      - 'tests/test_mega_ability_edge_cases.lua'
      - 'tests/test_mega_ability_interactions.lua'
      - 'docs/MEGA_ABILITY_AUDIT.md'
      - 'tests/test_mega_field_abilities.lua'
      - 'tests/test_mega_champions_abilities.lua'
      - 'tests/test_mega_precision_abilities.lua'
      - 'tests/test_mega_specialized_abilities.lua'
      - 'tests/test_mega_weather_abilities.lua'
      - 'tests/test_mega_tactical_abilities.lua'
      - 'tests/test_mega_reactive_abilities.lua'
      - 'tests/test_mega_abilities.lua'
      - 'tests/test_mega_move_abilities.lua'
      - 'src/mega_battle.lua'
      - 'src/mega_ui.lua'
      - 'src/mega_battle_ui.lua'
      - 'src/mega_tuner_model.lua'
      - 'src/mega_calibrator.lua'
      - 'data/mega_battle_forms.lua'
      - 'src/mega_item_icons.lua'
      - 'data/mega_presentation.lua'
      - 'src/mega_items.lua'
      - 'src/mega_lab_shop.lua'
      - 'tests/test_mega_lab_shop.lua'
      - 'src/mega_eligibility.lua'
      - 'data/mega_items.lua'
      - 'data/mega_forms.lua'
      - 'main.lua'
      - 'tests/test_mega_provider.lua'
      - 'tests/test_mega_selection.lua'
      - 'tests/test_mega_venusaur.lua'
      - 'tests/test_mega_standalone.lua'
      - 'tests/test_mega_full_roster.lua'
      - 'tests/test_mega_ui.lua'
      - 'tests/test_mega_party_icons.lua'
      - 'tests/test_mega_party_proxy.lua'
      - 'tests/test_mega_party_slot_menu.lua'
      - 'tests/test_mega_battle_ui.lua'
      - 'tests/test_mega_battle_sizing.lua'
      - 'tests/test_mega_presentation.lua'
      - 'tests/test_mega_tuner_model.lua'
      - 'tests/test_mega_calibrator.lua'
      - 'tests/test_mega_item_icons.lua'
      - 'tests/test_mega_items.lua'
      - '.github/workflows/runtime-art-provider.yml'
      - 'assets/runtime/mega_atlas_index.lua'

permissions:
  contents: read

jobs:
  lua-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: luac -p main.lua src/mega_atlas.lua src/mega_selection.lua src/mega_trainer_policy.lua src/mega_venusaur.lua src/mega_standalone.lua src/mega_abilities.lua src/mega_reactive_abilities.lua src/mega_tactical_abilities.lua src/mega_weather_abilities.lua src/mega_specialized_abilities.lua src/mega_precision_abilities.lua src/mega_champions_abilities.lua src/mega_field_abilities.lua src/mega_ability_interactions.lua src/mega_ability_edge_cases.lua src/mega_battle.lua src/mega_ui.lua src/mega_battle_ui.lua src/mega_tuner_model.lua src/mega_calibrator.lua src/mega_item_icons.lua src/mega_items.lua src/mega_lab_shop.lua src/mega_eligibility.lua data/mega_items.lua data/mega_forms.lua data/mega_trainer_choices.lua data/mega_battle_forms.lua data/mega_presentation.lua assets/runtime/mega_atlas_index.lua tests/test_mega_provider.lua tests/test_mega_selection.lua tests/test_mega_trainer_policy.lua tests/test_mega_items.lua tests/test_mega_venusaur.lua tests/test_mega_standalone.lua tests/test_mega_abilities.lua tests/test_mega_move_abilities.lua tests/test_mega_reactive_abilities.lua tests/test_mega_tactical_abilities.lua tests/test_mega_weather_abilities.lua tests/test_mega_specialized_abilities.lua tests/test_mega_precision_abilities.lua tests/test_mega_champions_abilities.lua tests/test_mega_field_abilities.lua tests/test_mega_ability_interactions.lua tests/test_mega_ability_edge_cases.lua tests/test_mega_full_roster.lua tests/test_mega_ui.lua tests/test_mega_party_icons.lua tests/test_mega_party_proxy.lua tests/test_mega_party_slot_menu.lua tests/test_mega_lab_shop.lua tests/test_mega_battle_ui.lua tests/test_mega_battle_sizing.lua tests/test_mega_presentation.lua tests/test_mega_tuner_model.lua tests/test_mega_calibrator.lua tests/test_mega_item_icons.lua
      - name: Verify packed Mega provider and compatibility boundaries
        run: lua tests/test_mega_provider.lua
      - name: Test ORAS-style Mega selection state machine
        run: lua tests/test_mega_selection.lua
      - name: Test NPC trainer Mega eligibility, selection and once-per-battle limit
        run: lua tests/test_mega_trainer_policy.lua
      - name: Test Mega item registration and battler eligibility
        run: lua tests/test_mega_items.lua
      - name: Verify professor's lab fundraisers and native Mega Stone shop
        run: lua tests/test_mega_lab_shop.lua
      - name: Test playable Mega Venusaur mechanics without mutating saves
        run: lua tests/test_mega_venusaur.lua
      - name: Test standalone stock-engine battle wrappers
        run: lua tests/test_mega_standalone.lua
      - name: Verify first batch of Mega damage abilities
        run: lua tests/test_mega_abilities.lua
      - name: Verify move-conversion, Scrappy and No Guard ability hooks
        run: lua tests/test_mega_move_abilities.lua
      - name: Verify defensive and reactive Mega ability hooks
        run: lua tests/test_mega_reactive_abilities.lua
      - name: Verify Defiant Infiltrator Prankster and Protean
        run: lua tests/test_mega_tactical_abilities.lua
      - name: Verify Mega weather, terrain and battlefield mechanics
        run: lua tests/test_mega_weather_abilities.lua
      - name: Verify specialised Mold Breaker Sheer Force Contrary Skill Link mechanics
        run: lua tests/test_mega_specialized_abilities.lua
      - name: Verify Parental Bond, Unseen Fist, Stalwart and Steadfast
        run: lua tests/test_mega_precision_abilities.lua
      - name: Verify Pokémon Champions Mega abilities and Unseen Fist fix
        run: lua tests/test_mega_champions_abilities.lua
      - name: Verify Mega Eelevate Fairy Aura Thermal Exchange Innards Out
        run: lua tests/test_mega_field_abilities.lua
      - name: Verify Intimidate-Contrary-Defiant and double-battle Healer
        run: lua tests/test_mega_ability_interactions.lua
      - name: Verify No Guard, Prankster, Parental Bond and Electric Terrain edge cases
        run: lua tests/test_mega_ability_edge_cases.lua
      - name: Validate all 98 Mega forms and save-safe battle state
        run: lua tests/test_mega_full_roster.lua
      - name: Check in-battle Mega summary stats, ability, icon and save isolation
        run: lua tests/test_mega_ui.lua
      - name: Verify full two-frame Mega icons in FireRed/Emerald party menus
        run: lua tests/test_mega_party_icons.lua
      - name: Verify active Mega party menu resolves battle proxy and original Pokémon
        run: lua tests/test_mega_party_proxy.lua
      - name: Reproduce native FireRed copied/reordered party draw with Mega icon
        run: lua tests/test_mega_party_slot_menu.lua
      - name: Test art-backed Mega button, selectable states, HP symbols and transformation effect
        run: lua tests/test_mega_battle_ui.lua
      - name: Verify Mega battle sizing, G9-compatible canvas pivot and HD tagging
        run: lua tests/test_mega_battle_sizing.lua
      - name: Verify 98 form/side presentations, 1x scales and shiny frame geometry
        run: lua tests/test_mega_presentation.lua
      - name: Test isolated 98-form Mega calibration model and Lua export
        run: lua tests/test_mega_tuner_model.lua
      - name: Test menu, battle stage preview, adjustments and export
        run: lua tests/test_mega_calibrator.lua
      - name: Verify Mega Stone icons in FRLG and RSE
        run: lua tests/test_mega_item_icons.lua

