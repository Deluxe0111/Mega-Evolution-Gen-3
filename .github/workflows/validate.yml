name: Validate project metadata
on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check manifest and artwork inventory format
        run: python tests/check_project.py
      - name: Install Lua for runtime policy regressions
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Check Emerald trainer Mega roster and in-game audit
        run: |
          lua tests/test_mega_boss_roster.lua
          lua tests/test_mega_trainer_audit_menu.lua
      - name: Check imported artwork if present
        run: python tools/validate_assets.py --root assets/source/ebdx --strict --no-report
